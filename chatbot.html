<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function ChatInput({messages, setMessages}) {
        const [inputText, setInputText] = React.useState('');
      }
        
        function saveInputText(event) {
          setInputText(event.target.value);
        }
        function sendMessage() {
          setMessages([...messages, {
            message: "test",
            sender: "user",
            id: crypto.randomUUID()
          }]);

          const response = Chatbot.getResponse(inputText);
           function sendMessage() {
          setMessages([...messages, {
            message: response,
            sender: "chatbot",
            id: crypto.randomUUID()
          }]);

          setInputText('');
        }
        
        return (
          <div >
            <input
             placeholder="Type your message to Chatbot" 
             size="30"
             onChange={saveInputText}
             value={inputText}            />
            <button onClick={sendMessage}
             >Send</button>
          </div>
        );
      }

      function ChatMessage({message, sender}) {
       // const {message, sender} = props;

       /* if (sender === 'chatbot') {
          return (
            <div>
              <img src="robot.png" width="50"/>
              {message}
            </div>
          );
        }*/

        return (
          <div>
           {sender === 'chatbot' && <img src="\image\robot.png" width="50"/>}
           {message}
           {sender === 'user' && <img src="\image\user.png" width="50"/>}
          </div>
        );
      }

      function Messages({messages}) {
        return (
          <>
            {messages.map((msg, index) => {
              return (
               <ChatMessage 
                key={msg.id}
                message={msg.message}
                sender={msg.sender}
                />
              );
            })}
          </>
        );
      }

      function App() {
         const [messages, setMessages] = React.useState([{
            message: "Hello chatbot",
            sender: "user",
            id: 'id1'
          },
          {
            message: "hello! how can I help you?",
            sender: "chatbot",
            id: 'id2'
          },
          {
            message: "can you get me today's date?",
            sender: "user",
            id: 'id3'
          },
          {
            message: "today is september 1st",
            sender: "chatbot",
            id: 'id4'
          }]);
        //const [messages, setMessages] = array;

        return (
          <>
           <ChatInput messages={messages} setMessages={setMessages}/>
           <Messages messages={messages}/>
          </>
        );
      }
      
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
