<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>

      body {
        font-family: Arial, sans-serif;
        margin: 0;
      }

      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        padding: 12px 20px;
        margin: 5px;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }

      .chat-input {
        padding: 12px 15px;
        margin: 5px;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 15px;
        flex-grow: 1;
      }

      .chat-input-container {
        display: flex;
        margin-bottom: 20px;
       
      }

      .app-container {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .user-message {
        display: flex;
        justify-content: flex-end;
        align-items: start;
      }

      .chatbot-message {
        display: flex;
        align-items: start;
      }

      .chat-message-text {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;
      }

      .chat-message-avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
      }

      .messages-container {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }

    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function ChatInput({messages, setMessages}) {
        const [inputText, setInputText] = React.useState('');

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        function sendMessage() {
          const response = Chatbot.getResponse(inputText);

          setMessages([...messages,
            {
              message: inputText,
              sender: "user",
              id: crypto.randomUUID()
            },
            {
              message: response,
              sender: "chatbot",
              id: crypto.randomUUID()
            }
          ]);

          setInputText('');
        }

        return (
          <div 
          className="chat-input-container">
            <input
             placeholder="Type your message to Chatbot" 
             size="30"
             onChange={saveInputText}
             value={inputText} 
             className="chat-input"         
           />
            <button
             onClick={sendMessage}
             className="send-button"
            >Send</button>
          </div>
        );
      }

      function ChatMessage({message, sender}) {
       // const {message, sender} = props;

       /* if (sender === 'chatbot') {
          return (
            <div>
              <img src="robot.png" width="50"/>
              {message}
            </div>
          );
        }*/

        return (
          <div className={
            sender === 'user' 
            ? 'user-message' 
            : 'chatbot-message'
          }>
           {sender === 'chatbot' && <img src="\image\robot.png" className="chat-message-avatar"/>}
          <div 
            className="chat-message-text">
            {message}
          </div>
           {sender === 'user' && <img src="\image\user.png" className="chat-message-avatar"/>}
          </div>
        );
      }

      function Messages({messages}) {
        const messagesContainerRef = React.useRef(null);
        React.useEffect(() => {
          const messagesContainer = document.querySelector('.messages-container');
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }, [messages]);
        return (
          <div className="messages-container">
            {messages.map((msg, index) => {
              return (
               <ChatMessage 
                key={msg.id}
                message={msg.message}
                sender={msg.sender}
                />
              );
            })}
          </div>
        );
      }

      function App() {
         const [messages, setMessages] = React.useState([{
            message: "Hello chatbot",
            sender: "user",
            id: 'id1'
          },
          {
            message: "hello! how can I help you?",
            sender: "chatbot",
            id: 'id2'
          },
          {
            message: "can you get me today's date?",
            sender: "user",
            id: 'id3'
          },
          {
            message: "today is september 1st",
            sender: "chatbot",
            id: 'id4'
          }]);
        //const [messages, setMessages] = array;

        return (
          <div
          className="app-container">
           <Messages messages={messages}/>
           <ChatInput messages={messages} setMessages={setMessages}/>
          </div>
        );
      }
      
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
